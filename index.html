<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jornada do Esporte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="caixa-principal">
    <h1 class="titulo">Desafio do Atleta</h1>

    <!-- Tela Inicial -->
    <div id="tela-inicial" class="caixa-conteudo">
      <p class="descricao">
        Sua missão é tomar as decisões certas no mundo dos esportes e do Muay Thai. 
        Suas escolhas definirão sua trajetória como atleta!
      </p>
      <button id="btn-iniciar" class="btn">Iniciar Jornada</button>
    </div>

    <!-- Tela do Jogo -->
    <div id="tela-jogo" class="caixa-conteudo escondido">
      <p id="enunciado-pergunta" class="texto-pergunta"></p>
      <div id="caixa-alternativas" class="caixa-botoes"></div>
    </div>

    <!-- Tela Final -->
    <div id="tela-final" class="caixa-conteudo escondido">
      <h2>Jornada Concluída!</h2>
      <p id="texto-resultado" class="texto-resultado"></p>
      <button id="btn-reiniciar" class="btn btn-reiniciar">Jogar Novamente</button>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
