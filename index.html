<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jornada 2049</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="caixa-principal">
    <h1 class="titulo">Em 2049...</h1>

    <div id="tela-inicial" class="caixa-conteudo">
      <p class="descricao">
        Sua missão é tomar decisões cruciais para a sobrevivência da colônia tecnológica. 
        Suas escolhas moldarão o futuro do planeta!
      </p>
      <button id="btn-iniciar" class="btn">Iniciar Missão</button>
    </div>

    <div id="tela-jogo" class="caixa-conteudo escondido">
      <p id="enunciado-pergunta" class="texto-pergunta"></p>
      <div id="caixa-alternativas" class="caixa-botoes"></div>
    </div>

    <div id="tela-final" class="caixa-conteudo escondido">
      <h2>Missão Concluída!</h2>
      <p id="texto-resultado" class="texto-resultado"></p>
      <button id="btn-reiniciar" class="btn btn-reiniciar">Jogar Novamente</button>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
